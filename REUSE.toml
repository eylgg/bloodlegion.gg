version = 1

[[annotations]]
path = [
    "apps/addon/**",
    "apps/web/**",
    "crates/*/**",
    ".cargo/config.toml",
    ".containerignore",
    ".github/**",
    ".gitattributes",
    ".gitignore",
    "Caddyfile",
    "Cargo.lock",
    "Cargo.toml",
    "README.md",
]
SPDX-FileCopyrightText = "2026 Jonathan Eyolfson <jon@eyolfson.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Blizzard's artwork and item data, vendored for the launch sign-ups and the item mirror; listed
# after the project-wide annotation above so it takes precedence for these files.
[[annotations]]
path = ["apps/web/static/wow/**", "crates/bloodlegion-server/data/game-items/**"]
precedence = "override"
SPDX-FileCopyrightText = "Blizzard Entertainment, Inc."
SPDX-License-Identifier = "LicenseRef-Blizzard-Entertainment"
